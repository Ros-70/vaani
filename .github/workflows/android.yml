name: Android CI

# Pinned versions (kept in sync with build.gradle.kts / app/build.gradle.kts):
#   JDK 17 (temurin), Android Gradle Plugin 8.5.2, Kotlin 2.0.20,
#   compileSdk 34, minSdk 26, NDK 26.3.11579264, CMake 3.22.1

on:
  push:
  pull_request:

jobs:
  unit-tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (TextPipeline golden values + caret/permission-flow tests)
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  instrumented-tests:
    runs-on: ubuntu-latest
    needs: unit-tests-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            # Make Vaani the active system keyboard before the test suite
            # runs, exactly the way real third-party keyboard apps validate
            # themselves in CI (see VaaniImeInstrumentedTest's doc comment).
            adb shell ime enable com.vaani.keyboard/com.vaani.keyboard.ime.VaaniInputMethodService
            adb shell ime set com.vaani.keyboard/com.vaani.keyboard.ime.VaaniInputMethodService
            ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: unit-tests-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vaani-debug-apk
          path: app/build/outputs/apk/debug/*.apk
